
name: DocuFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only needs permission to read repository contents.
permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests and Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: docuflow_test
          POSTGRES_USER: docuflow_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docuflow_user -d docuflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_NAME: DocuFlow AI
      APP_ENV: testing
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://docuflow_user:ci_test_password@localhost:5432/docuflow_test
      TEST_DATABASE_URL: postgresql+psycopg://docuflow_user:ci_test_password@localhost:5432/docuflow_test
      JWT_SECRET_KEY: ci_only_dummy_secret_not_for_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Ruff lint
        run: ruff check app tests

      - name: Check Ruff formatting
        run: ruff format --check app tests

      - name: Run backend tests
        run: pytest -q

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
 