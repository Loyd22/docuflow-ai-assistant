services:
  postgres:
    image: postgres:16
    container_name: docuflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuflow_db
    ports:
      - "5434:5432"
    volumes:
      - docuflow_postgres_data:/var/lib/postgresql/data

volumes:
  docuflow_postgres_data: